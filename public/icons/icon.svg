<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#722f37"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="needleN" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background, brand gradient -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- Subtle outer ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <circle cx="256" cy="256" r="138" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

  <!-- Cardinal tick marks -->
  <g fill="rgba(255,255,255,0.55)">
    <rect x="254" y="78"  width="4" height="22" rx="2"/>
    <rect x="254" y="412" width="4" height="22" rx="2"/>
    <rect x="78"  y="254" width="22" height="4" rx="2"/>
    <rect x="412" y="254" width="22" height="4" rx="2"/>
  </g>

  <!-- Secondary (E/S/W) points — translucent cream -->
  <polygon points="256,402 270,262 256,276 242,262" fill="rgba(255,247,237,0.45)"/>
  <polygon points="402,256 262,242 276,256 262,270" fill="rgba(255,247,237,0.45)"/>
  <polygon points="110,256 250,270 236,256 250,242" fill="rgba(255,247,237,0.45)"/>

  <!-- North pointer — gold-tinted highlight to echo the brand -->
  <polygon points="256,110 240,252 256,238 272,252" fill="url(#needleN)"/>

  <!-- Center hub -->
  <circle cx="256" cy="256" r="22" fill="#fffaf0"/>
  <circle cx="256" cy="256" r="9"  fill="#722f37"/>
</svg>
