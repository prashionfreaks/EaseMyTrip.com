<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />

    <!-- Content Security Policy -->
    <!-- `img-src` needs `data:` for the photo-compression canvas preview and `blob:` for runtime.
         `connect-src` covers Supabase auth/storage/functions/realtime (wss) and Unsplash hero images.
         `style-src 'unsafe-inline'` is required because the app uses inline style props extensively.
         `script-src` stays strict ('self' only) — no inline or eval scripts. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co https://images.unsplash.com https://lh3.googleusercontent.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.resend.com https://images.unsplash.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#0c1a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LetsWander" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Slambook fonts (Caveat = handwritten title, Patrick Hand = notebook body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet" />

    <!-- Splash screens (iOS) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>LetsWander – Group Trip Planner</title>
    <meta name="description" content="Plan trips together, with zero drama. Group chat, polls, budgets, itineraries, and photos — all in one place." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
